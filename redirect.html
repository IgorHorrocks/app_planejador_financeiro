<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conectando à Microsoft…</title>
</head>
<body>
  <p style="font-family:system-ui,sans-serif;color:#555">Concluindo login Microsoft…</p>
  <script type="module">
    import { broadcastResponseToMainFrame } from "https://esm.sh/@azure/msal-browser@5.21.0/redirect-bridge";
    broadcastResponseToMainFrame().catch((error) => {
      console.error("Erro ao concluir o redirecionamento Microsoft:", error);
      document.body.innerHTML =
        '<p style="font-family:system-ui,sans-serif;color:#a00">Não foi possível concluir o login. Feche esta janela e tente novamente.</p>';
    });
  </script>
</body>
</html>
